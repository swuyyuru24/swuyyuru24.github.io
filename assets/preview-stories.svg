  <text x="110" y="160" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff" opacity="0.9">E</text>
  <text x="38" y="210" font-size="12" font-weight="700" fill="#e8e8ed">Ember &amp; Ash</text>
  <text x="38" y="226" font-size="9" fill="#8888a0">by aria_writes</text>
  <text x="38" y="246" font-size="8.5" fill="#8888a0">A kingdom burns, a girl</text>
