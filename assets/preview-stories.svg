  <rect x="38" y="270" width="58" height="18" rx="9" fill="#1c1c2e"/>
  <text x="67" y="282" text-anchor="middle" font-size="8" fill="#ff6122">Fantasy</text>
  <text x="38" y="304" font-size="8" fill="#8888a0">24 ch · 8.2k reads · 1.1k recs</text>

  <!-- ===== Story card 2 ===== -->
  <rect x="213" y="98" width="173" height="218" rx="12" fill="#14141f" stroke="#2a2a3e"/>
  <path d="M213 110 a12 12 0 0 1 12 -12 h149 a12 12 0 0 1 12 12 v78 h-173 z" fill="url(#scov2)"/>
  <text x="299" y="160" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff" opacity="0.9">M</text>
  <text x="227" y="210" font-size="12" font-weight="700" fill="#e8e8ed">Midnight Letters</text>
  <text x="227" y="226" font-size="9" fill="#8888a0">by june.m</text>
  <text x="227" y="246" font-size="8.5" fill="#8888a0">Two strangers, one inbox,</text>
  <text x="227" y="258" font-size="8.5" fill="#8888a0">a love built on words…</text>
  <rect x="227" y="270" width="58" height="18" rx="9" fill="#1c1c2e"/>
  <text x="256" y="282" text-anchor="middle" font-size="8" fill="#ff6122">Romance</text>
  <text x="227" y="304" font-size="8" fill="#8888a0">18 ch · 12.4k reads · 2.3k recs</text>

  <!-- ===== Story card 3 ===== -->
  <rect x="402" y="98" width="173" height="218" rx="12" fill="#14141f" stroke="#2a2a3e"/>
  <path d="M402 110 a12 12 0 0 1 12 -12 h149 a12 12 0 0 1 12 12 v78 h-173 z" fill="url(#scov3)"/>
  <text x="488" y="160" text-anchor="middle" font-size="46" font-weight="800" fill="#ffffff" opacity="0.9">T</text>
  <text x="416" y="210" font-size="12" font-weight="700" fill="#e8e8ed">The Quiet Floor</text>
