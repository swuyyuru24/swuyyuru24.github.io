    </linearGradient>
    <linearGradient id="scov2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="100%" stop-color="#ff6122"/>
    </linearGradient>
    <linearGradient id="scov3" x1="0" y1="0" x2="1" y2="1">
