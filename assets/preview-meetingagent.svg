    </linearGradient>
  </defs>
  <!-- Light app background -->
  <rect width="600" height="340" fill="#ffffff" rx="12"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="12" fill="none" stroke="#E2E8F0"/>

  <!-- Header bar -->
