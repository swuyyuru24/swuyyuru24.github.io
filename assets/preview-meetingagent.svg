  <text x="133" y="210" text-anchor="middle" font-size="9" fill="#475569">Hiring</text>
  <rect x="168" y="196" width="80" height="20" rx="10" fill="#F1F5F9"/>
  <text x="208" y="210" text-anchor="middle" font-size="9" fill="#475569">Mobile beta</text>

