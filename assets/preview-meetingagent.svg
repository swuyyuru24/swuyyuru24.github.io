  <circle cx="30" cy="262" r="3" fill="#8B5CF6"/>
  <text x="40" y="266" font-size="9.5" fill="#475569">Approved 2 backend hires</text>
  <circle cx="30" cy="282" r="3" fill="#8B5CF6"/>
  <text x="40" y="286" font-size="9.5" fill="#475569">Launch moved to Sept 30</text>
  <circle cx="30" cy="302" r="3" fill="#8B5CF6"/>
  <text x="40" y="306" font-size="9.5" fill="#475569">Billing revamp is P0</text>

