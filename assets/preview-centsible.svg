<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Geist',system-ui,sans-serif">
  <!-- Light app background -->
  <rect width="600" height="340" fill="#ffffff" rx="12"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="12" fill="none" stroke="#EBEBEB"/>

  <!-- Header -->
  <text x="24" y="38" font-size="20" font-weight="700" fill="#1A1A1A">Dashboard</text>
  <circle cx="572" cy="32" r="3" fill="#6366F1"/>

  <!-- ===== Summary stat cards ===== -->
  <!-- Net Worth -->
  <rect x="24" y="56" width="129" height="68" rx="10" fill="#ffffff" stroke="#EBEBEB"/>
  <text x="38" y="78" font-size="9" fill="#8A8A8A">Net Worth</text>
  <text x="38" y="100" font-size="17" font-weight="700" fill="#1A1A1A">$48,250</text>
  <text x="38" y="114" font-size="8" fill="#8A8A8A">4 accounts</text>
  <!-- Spending -->
  <rect x="165" y="56" width="129" height="68" rx="10" fill="#ffffff" stroke="#EBEBEB"/>
  <text x="179" y="78" font-size="9" fill="#8A8A8A">Spending</text>
  <text x="179" y="100" font-size="17" font-weight="700" fill="#1A1A1A">$2,340</text>
  <text x="179" y="114" font-size="8" fill="#DC2626">▼ 8% vs last mo</text>
  <!-- Income -->
  <rect x="306" y="56" width="129" height="68" rx="10" fill="#ffffff" stroke="#EBEBEB"/>
  <text x="320" y="78" font-size="9" fill="#8A8A8A">Income</text>
  <text x="320" y="100" font-size="17" font-weight="700" fill="#16A34A">$5,800</text>
  <text x="320" y="114" font-size="8" fill="#8A8A8A">this month</text>
  <!-- Saved -->
  <rect x="447" y="56" width="129" height="68" rx="10" fill="#ffffff" stroke="#EBEBEB"/>
  <text x="461" y="78" font-size="9" fill="#8A8A8A">Saved</text>
  <text x="461" y="100" font-size="17" font-weight="700" fill="#16A34A">$3,460</text>
  <text x="461" y="114" font-size="8" fill="#8A8A8A">this month</text>

  <!-- ===== Spending by Category (horizontal bars) ===== -->
  <rect x="24" y="136" width="270" height="180" rx="10" fill="#ffffff" stroke="#EBEBEB"/>
  <text x="40" y="160" font-size="11" font-weight="600" fill="#1A1A1A">Spending by Category</text>
  <!-- Groceries -->
  <text x="40" y="186" font-size="9" fill="#8A8A8A">Groceries</text>
  <rect x="110" y="178" width="120" height="10" rx="5" fill="#6366F1"/>
  <text x="278" y="186" text-anchor="end" font-size="9" fill="#1A1A1A">$640</text>
  <!-- Dining -->
  <text x="40" y="210" font-size="9" fill="#8A8A8A">Dining</text>
  <rect x="110" y="202" width="92" height="10" rx="5" fill="#F59E0B"/>
  <text x="278" y="210" text-anchor="end" font-size="9" fill="#1A1A1A">$480</text>
  <!-- Transport -->
  <text x="40" y="234" font-size="9" fill="#8A8A8A">Transport</text>
  <rect x="110" y="226" width="64" height="10" rx="5" fill="#84CC16"/>
  <text x="278" y="234" text-anchor="end" font-size="9" fill="#1A1A1A">$320</text>
  <!-- Shopping -->
  <text x="40" y="258" font-size="9" fill="#8A8A8A">Shopping</text>
  <rect x="110" y="250" width="48" height="10" rx="5" fill="#06B6D4"/>
  <text x="278" y="258" text-anchor="end" font-size="9" fill="#1A1A1A">$240</text>
  <!-- Bills -->
  <text x="40" y="282" font-size="9" fill="#8A8A8A">Bills</text>
  <rect x="110" y="274" width="36" height="10" rx="5" fill="#EC4899"/>
  <text x="278" y="282" text-anchor="end" font-size="9" fill="#1A1A1A">$180</text>

  <!-- ===== Recent Transactions ===== -->
  <rect x="306" y="136" width="270" height="180" rx="10" fill="#ffffff" stroke="#EBEBEB"/>
  <text x="322" y="160" font-size="11" font-weight="600" fill="#1A1A1A">Recent Transactions</text>
  <text x="560" y="160" text-anchor="end" font-size="9" fill="#6366F1">View all</text>
  <!-- row 1 -->
  <text x="322" y="184" font-size="10" fill="#1A1A1A">Whole Foods</text>
  <text x="322" y="197" font-size="8" fill="#8A8A8A">Jun 14 · 🍔 Groceries</text>
  <text x="560" y="188" text-anchor="end" font-size="10" fill="#1A1A1A">-$67.42</text>
  <line x1="322" y1="208" x2="560" y2="208" stroke="#F0F0F0"/>
  <!-- row 2 -->
  <text x="322" y="226" font-size="10" fill="#1A1A1A">Paycheck</text>
  <text x="322" y="239" font-size="8" fill="#8A8A8A">Jun 13 · 💰 Income</text>
  <text x="560" y="230" text-anchor="end" font-size="10" fill="#16A34A">+$2,900</text>
  <line x1="322" y1="250" x2="560" y2="250" stroke="#F0F0F0"/>
  <!-- row 3 -->
  <text x="322" y="268" font-size="10" fill="#1A1A1A">Netflix</text>
  <text x="322" y="281" font-size="8" fill="#8A8A8A">Jun 12 · 🎬 Entertainment</text>
  <text x="560" y="272" text-anchor="end" font-size="10" fill="#1A1A1A">-$15.99</text>
  <line x1="322" y1="292" x2="560" y2="292" stroke="#F0F0F0"/>
  <!-- row 4 -->
  <text x="322" y="310" font-size="10" fill="#1A1A1A">Uber</text>
  <text x="494" y="310" text-anchor="start" font-size="8" fill="#8A8A8A"></text>
  <text x="560" y="310" text-anchor="end" font-size="10" fill="#1A1A1A">-$24.50</text>
</svg>
